name: Weekly Family Crossword

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0"

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CROSSWORD_INPUT: examples/weekly_context.yml
      CROSSWORD_OUTPUT: dist/crossword
      CROSSWORD_SIZES: 13,11,9
      CROSSWORD_ATTEMPTS: 2000
      CROSSWORD_TIMEOUT_MINUTES: 20
      CROSSWORD_BACKEND: local
      CROSSERVILLE_EMAIL: ${{ secrets.CROSSERVILLE_EMAIL }}
      CROSSERVILLE_PASSWORD: ${{ secrets.CROSSERVILLE_PASSWORD }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install generator
        run: python -m pip install -e .

      - name: Install browser runtime
        if: env.CROSSWORD_BACKEND == 'crosserville'
        run: python -m playwright install --with-deps chromium

      - name: Generate crossword artifacts
        run: |
          family-crossword generate \
            --input "$CROSSWORD_INPUT" \
            --out "$CROSSWORD_OUTPUT" \
            --sizes "$CROSSWORD_SIZES" \
            --attempts "$CROSSWORD_ATTEMPTS" \
            --timeout-minutes "$CROSSWORD_TIMEOUT_MINUTES" \
            --backend "${CROSSWORD_BACKEND:-local}"

      - name: Upload crossword artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-family-crossword
          path: ${{ env.CROSSWORD_OUTPUT }}

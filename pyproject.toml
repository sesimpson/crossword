[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "family-crossword"
version = "0.1.0"
description = "Weekly family-themed crossword generator for site pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.99.0",
  "playwright>=1.50.0",
  "puzpy>=0.6.1",
  "PyYAML>=6.0.2",
  "wordfreq>=3.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
family-crossword = "family_crossword.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
